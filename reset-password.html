<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset DOMINANCE Password</title><link rel="stylesheet" href="/dominance-theme.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif}*{box-sizing:border-box}.wrap{width:min(470px,92vw)}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:18px}.d{position:relative;font:700 48px Georgia,serif;color:var(--dom-gold)}.d:before{content:'♛';position:absolute;font-size:23px;top:-9px;left:9px;color:var(--dom-gold-bright)}.word{font:700 22px Georgia,serif;letter-spacing:.15em;color:var(--dom-gold)}.card{border-radius:16px;padding:22px;box-shadow:0 28px 70px #0009}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:900}.card h1{font-size:24px;margin:7px 0}.muted{font-size:11px;line-height:1.5}.field{margin-top:12px}.field label{display:block;font-size:9px;color:#8ea0aa;margin-bottom:5px}.field input{width:100%;border-radius:8px;padding:11px;font-size:13px}.btn{width:100%;margin-top:13px;padding:11px;border-radius:8px;background:linear-gradient(135deg,var(--dom-gold-bright),#d5a934)!important;color:#090c0f!important;border:1px solid var(--dom-gold-bright)!important;font-weight:900;cursor:pointer}.error{font-size:10px;color:var(--dom-bad);margin-top:10px}.success{font-size:10px;color:var(--dom-live);margin-top:10px;line-height:1.45}.success a{color:var(--dom-gold-bright)}</style></head><body><div class="wrap"><div class="brand"><span class="d">D</span><span class="word">DOMINANCE</span></div><div class="card"><div class="eyebrow">SECURE ACCOUNT RECOVERY</div><h1>Create a new password.</h1><p class="muted">Your reset link can be used once and expires after 30 minutes. Changing your password does not remove DOMINANCE two-factor authentication.</p><div class="field"><label>NEW PASSWORD</label><input id="password" type="password" autocomplete="new-password"></div><div class="field"><label>CONFIRM PASSWORD</label><input id="confirm" type="password" autocomplete="new-password"></div><p class="muted">Minimum 12 characters with upper-case, lower-case and a number.</p><button class="btn" onclick="resetPassword()">Reset Password</button><div class="error" id="error"></div><div class="success" id="success"></div></div></div><script>const token=new URLSearchParams(location.search).get('token')||'';async function resetPassword(){error.textContent='';success.textContent='';if(password.value!==confirm.value){error.textContent='Passwords do not match.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to reset password');success.innerHTML=d.message+' <a href="/login.html">Return to secure sign in</a>.';password.value='';confirm.value=''}catch(e){error.textContent=e.message}}if(!token)error.textContent='This reset link is missing its secure token. Request a new password reset from the login page.';</script></body></html>

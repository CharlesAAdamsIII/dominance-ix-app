databases:
  - name: dominance-auth-db
    plan: starter
    databaseName: dominance
    user: dominance

services:
  - type: web
    name: dominance-market-radar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MAX_CRAWL_PAGES
        value: 8
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

  - type: worker
    name: dominance-intelligence-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node worker.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: WORKER_INTERVAL_MINUTES
        value: 15
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString

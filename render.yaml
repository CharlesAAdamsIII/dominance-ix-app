databases:
  - name: dominance-auth-db
    plan: starter
    databaseName: dominance
    user: dominance

services:
  - type: web
    name: dominance-market-radar
    runtime: node
    plan: starter
    buildCommand: npm install && npm run test:control && npm run test:execution
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MAX_CRAWL_PAGES
        value: 8
      - key: APP_URL
        value: https://dominance-market-radar.onrender.com
      - key: INTELLIGENCE_RESCUE_CHECK_MINUTES
        value: 5
      - key: INTELLIGENCE_RESCUE_STALE_MINUTES
        value: 10
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_VIDEO_MODEL
        value: sora-2
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v25
      - key: GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: CMS_DATA_API_URL
        sync: false

  - type: worker
    name: dominance-intelligence-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run test:control && npm run test:execution
    startCommand: node worker-suite.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: WORKER_INTERVAL_MINUTES
        value: 15
      - key: PROFILE_WORKER_INTERVAL_MINUTES
        value: 15
      - key: MARKET_INTELLIGENCE_INTERVAL_MINUTES
        value: 30
      - key: DEMAND_SURFACE_INTERVAL_MINUTES
        value: 60
      - key: MARKET_REGIONAL_SNAPSHOT_INTERVAL_MINUTES
        value: 15
      - key: DEMAND_EVENT_INTERVAL_MINUTES
        value: 15
      - key: MARKET_NEWS_INTERVAL_MINUTES
        value: 60
      - key: COMPETITOR_INTELLIGENCE_INTERVAL_MINUTES
        value: 30
      - key: COMPETITOR_REFRESH_QUEUE_MINUTES
        value: 1
      - key: COMPETITOR_TRACKED_KEYWORDS
        value: 5
      - key: CREATIVE_RESEARCH_INTERVAL_MINUTES
        value: 30
      - key: CREATIVE_PRODUCTION_INTERVAL_MINUTES
        value: 1
      - key: CREATIVE_QUEUE_INTERVAL_MINUTES
        value: 1
      - key: CAMPAIGN_BUILD_INTERVAL_MINUTES
        value: 15
      - key: PLATFORM_EXECUTION_INTERVAL_MINUTES
        value: 1
      - key: PUBLIC_INTELLIGENCE_INTERVAL_HOURS
        value: 24
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_VIDEO_MODEL
        value: sora-2
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v25
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: CMS_DATA_API_URL
        sync: false
      - key: DOMINANCE_RUN_SMOKE_TEST
        value: "false"

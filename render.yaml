databases:
  - name: dominance-auth-db
    plan: starter
    databaseName: dominance
    user: dominance

services:
  - type: web
    name: dominance-market-radar
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MAX_CRAWL_PAGES
        value: 8
      - key: APP_URL
        value: https://dominance-market-radar.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: dominance-intelligence-worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node worker-suite.js
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: WORKER_INTERVAL_MINUTES
        value: 15
      - key: PROFILE_WORKER_INTERVAL_MINUTES
        value: 15
      - key: CREATIVE_QUEUE_INTERVAL_MINUTES
        value: 1
      - key: PUBLIC_INTELLIGENCE_INTERVAL_HOURS
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: dominance-auth-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: CMS_DATA_API_URL
        sync: false
      - key: DOMINANCE_RUN_SMOKE_TEST
        value: "false"

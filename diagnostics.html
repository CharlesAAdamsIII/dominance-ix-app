<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOMINANCE Connection Diagnostics</title><style>body{margin:0;background:#061018;color:#edf6fb;font-family:Arial,sans-serif}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{margin:0;font-size:26px}.sub{color:#8297a4;font-size:11px;margin-top:5px}.btn{background:#5de0c2;color:#061018;border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.card{background:#0d1a23;border:1px solid #213440;border-radius:12px;padding:13px}.card h3{font-size:11px;margin:0 0 8px;color:#8da2af}.value{font-size:18px;font-weight:900}.good{color:#73e5a1}.warn{color:#ffd66f}.bad{color:#ff8f8f}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 8px}.row{display:grid;grid-template-columns:1.4fr .8fr 1.3fr 1.5fr;gap:8px;padding:10px;border-top:1px solid #1e303b;font-size:10px;align-items:center}.row:first-of-type{border-top:0}.head{color:#738895;font-weight:900}.box{background:#0b1720;border:1px solid #213440;border-radius:12px;padding:10px}.raw{white-space:pre-wrap;word-break:break-word;font:10px monospace;color:#9db0ba;background:#071119;border-radius:8px;padding:10px;margin-top:10px}.pill{display:inline-block;padding:5px 7px;border-radius:999px;font-size:8px;font-weight:900;background:#192832}.pill.good{background:#173822}.pill.warn{background:#3c3215}.pill.bad{background:#3e1d1d}.note{margin-top:12px;border:1px solid #3d371d;background:#1f1b0f;color:#e4c867;padding:10px;border-radius:9px;font-size:10px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.head{display:none}}</style></head><body><div class="wrap"><div class="top"><div><h1>DOMINANCE Connection Diagnostics</h1><div class="sub">This page reads the live server registry. It does not use browser-local connection state.</div></div><button class="btn" onclick="run()">Refresh Diagnostics</button></div><div class="grid"><div class="card"><h3>DATABASE</h3><div class="value" id="db">…</div></div><div class="card"><h3>GOOGLE OAUTH SERVER</h3><div class="value" id="oauth">…</div></div><div class="card"><h3>ACTIVE ACCOUNT</h3><div class="value" id="acct">…</div></div><div class="card"><h3>LIVE SOURCES</h3><div class="value" id="live">…</div></div></div><div class="section"><h2>Connection Registry</h2><div class="box" id="connections">Loading…</div></div><div class="section"><h2>Background Worker</h2><div class="box" id="worker">Loading…</div></div><div class="note" id="diagnosis">Running diagnostics…</div><div class="section"><h2>Raw Server Responses</h2><div class="raw" id="raw"></div></div></div><script>const $=id=>document.getElementById(id);async function j(url){const r=await fetch(url,{cache:'no-store'});let d={};try{d=await r.json()}catch(e){d={parse_error:String(e)}}return{status:r.status,ok:r.ok,data:d}}function pill(s){const live=['connected','enabled'].includes(s),cfg=s==='configured';return `<span class="pill ${live?'good':cfg?'warn':'bad'}">${String(s||'unknown').toUpperCase()}</span>`}async function run(){try{const [h,a,c,w]=await Promise.all([j('/api/health?ts='+Date.now()),j('/api/accounts/active?ts='+Date.now()),j('/api/connections?ts='+Date.now()),j('/api/worker/status?ts='+Date.now())]);const health=h.data||{},account=a.data?.account||null,conns=c.data?.connections||[],liveConns=conns.filter(x=>['connected','enabled'].includes(x.status));$('db').textContent=health.database_connected?'CONNECTED':'NOT READY';$('db').className='value '+(health.database_connected?'good':'bad');$('oauth').textContent=health.google_oauth_configured?'READY':'NOT READY';$('oauth').className='value '+(health.google_oauth_configured?'good':'bad');$('acct').textContent=account?account.company_name:'NONE';$('acct').className='value '+(account?'good':'bad');$('live').textContent=String(liveConns.length);$('live').className='value '+(liveConns.length?'good':'warn');$('connections').innerHTML=conns.length?`<div class="row head"><div>PROVIDER</div><div>STATUS</div><div>SELECTED RESOURCE</div><div>LAST SYNC / ERROR</div></div>`+conns.map(x=>`<div class="row"><div><b>${x.provider_name||x.provider_key}</b><br><span style="color:#6f8594">${x.provider_key}</span></div><div>${pill(x.status)}</div><div>${x.metadata?.selected_resource||x.metadata?.account_identifier||'—'}</div><div>${x.last_error?'<span class="bad">'+x.last_error+'</span>':(x.last_sync_at?new Date(x.last_sync_at).toLocaleString():'—')}</div></div>`).join(''):'<span class="bad">No connection records exist for the active server-side account.</span>';$('worker').innerHTML=w.data?.worker?`<b>Status:</b> ${w.data.worker.status||'unknown'}<br><b>Last heartbeat:</b> ${w.data.worker.last_heartbeat_at?new Date(w.data.worker.last_heartbeat_at).toLocaleString():'none'}<br><b>Details:</b> ${JSON.stringify(w.data.worker.details||{})}`:'No worker state returned.';let msg='';if(!h.ok||!health.database_connected)msg='Database/server configuration is failing.';else if(!account)msg='There is no active server-side company account. The browser may be showing a local company profile that was never persisted.';else if(!health.google_oauth_configured)msg='Google APIs may be enabled in Google Cloud, but DOMINANCE is missing one or more Render OAuth environment variables.';else if(!conns.length)msg='OAuth server is ready, but this company has no saved provider connection records. Open Data Connections and authorize Google for this account.';else if(!liveConns.length)msg='The providers are saved/configured but none are actually OAuth CONNECTED or public ENABLED yet.';else{const googleLive=liveConns.filter(x=>['GA4','GSC','GADS'].includes(x.provider_key));const selected=googleLive.filter(x=>x.metadata?.selected_resource);msg=`Server state is healthy: ${liveConns.length} live source(s). ${googleLive.length} Google source(s) authorized; ${selected.length} have a selected resource. If the OS still disagrees, the remaining issue is dashboard rendering/cache, not the connection registry.`}$('diagnosis').textContent=msg;$('raw').textContent=JSON.stringify({health:h,account:a,connections:c,worker:w},null,2)}catch(e){$('diagnosis').textContent='Diagnostics failed: '+e.message;$('diagnosis').className='note bad'}}run();</script></body></html>
